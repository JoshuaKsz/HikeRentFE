
<!-- Overlay -->
<div
  class="sidebar-overlay"
  [class.show]="isOpen"
  (click)="toggleSidebar()">
</div>

<!-- Sidebar -->
<aside
  class="sidebar"
  [class.show]="isOpen"
  [class.collapsed]="isCollapsed">

  <!-- Hamburger Button -->
  <button
    class="toggle-btn"
    (click)="toggleCollapse()"
    type="button">

    <i class="bi bi-list"></i>

  </button>

  <!-- Brand / Logo -->
  <div class="brand d-flex align-items-center">

    <img
      src="assets/images/logo.png"
      alt="HikeRent Logo">

    <span *ngIf="!isCollapsed" class="text-white">
      HikeRent
    </span>

  </div>

  <!-- Main Menu -->
  <ng-container *ngFor="let menu of mainMenu">

    <!-- Garis pemisah sebelum Logout -->
    <hr *ngIf="menu.name === 'Logout'">

    <!-- Menu Utama -->
    <a
      href="javascript:void(0)"
      class="menu-item"
      [class.active]="activeMenu === menu.name"
      [class.active-parent]="menu.name === 'Data Alat' &&
        (activeMenu === 'Alat Pendakian' ||
         activeMenu === 'Kategori & Merek')"
      (click)="selectMenu(menu.name)"
      [title]="isCollapsed ? menu.name : ''">

      <i class="bi" [ngClass]="menu.icon"></i>

      <span *ngIf="!isCollapsed">
        {{ menu.name }}
      </span>

      <!-- Dropdown Arrow -->
      <i
        *ngIf="menu.children.length > 0 && !isCollapsed"
        class="bi dropdown-icon"
        [ngClass]="isGearMenuOpen
          ? 'bi-chevron-down'
          : 'bi-chevron-right'">
      </i>

    </a>

    <!-- Submenu Data Alat -->
    <div
      class="submenu"
      *ngIf="menu.children.length > 0 &&
             isGearMenuOpen &&
             !isCollapsed">

      <a
        *ngFor="let child of menu.children"
        href="javascript:void(0)"
        class="submenu-item"
        [class.active]="activeMenu === child.name"
        (click)="selectSubMenu(child.name)">

        {{ child.name }}

      </a>

    </div>

  </ng-container>

</aside>
