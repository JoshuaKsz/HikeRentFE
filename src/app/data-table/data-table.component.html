<div class="card shadow border-0 p-3">
    <h2>{{ title }}</h2>
    <div class="card-body">
        <table class="table">
            <thead class="table-secondary">
                <tr>
                    <th class="text-center align-middle" *ngFor="let header of headers">
                        {{ header }}
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of data">
                    <td
                        *ngFor="let header of headers"
                        class="text-center align-middle"
                        [class.col-status]="isStatusColumn(header)"
                        [class.col-action]="isActionColumn(header)"
                        [attr.title]="(!isStatusColumn(header) && !isActionColumn(header)) ? row[header] : null">
                        @if (isStatusColumn(header)) {
                            <div
                                class="rounded-3 border border-2"
                                [ngClass]="
                                    row[header] === 'Completed'
                                        ? 'border-success bg-success bg-opacity-10'
                                        : row[header] === 'Ongoing'
                                            ? 'border-warning bg-warning bg-opacity-10'
                                            : row[header] === 'Failed'
                                                ? 'border-danger bg-danger bg-opacity-10'
                                                : '' "
                            >
                                {{ row[header] }}
                            </div>
                        } @else if (isActionColumn(header)) {
                            <button class="btn btn-sm me-1 detail-button" (click)="view.emit(row)" title="Detail">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-primary me-1" (click)="edit.emit(row)" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" (click)="delete.emit(row)" title="Hapus">
                                <i class="bi bi-trash"></i>
                            </button>
                        } @else if (isDateColumn(header)) {
                            {{ row[header] | date:'dd/MM/yyyy' }}
                        } @else {
                            {{ row[header] }}
                        }
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
