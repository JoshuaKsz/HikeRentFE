
<div class="form-page">
  <div class="page-heading">
    <div>
      <h2>Tambah Alat Pendakian</h2>
      <p>Masukkan informasi alat pendakian yang akan ditambahkan.</p>
    </div>
  </div>

  <div class="form-card">
    <form #gearForm="ngForm" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="form-group">
          <label>Nama Alat</label>
          <input
            type="text"
            class="form-control"
            name="gearName"
            [(ngModel)]="form.gearName"
            maxlength="150"
            required
            placeholder="Contoh: Tenda Dome">
        </div>

        <div class="form-group">
          <label>Kategori</label>
          <select
            class="form-select"
            name="categoryId"
            [(ngModel)]="form.categoryId"
            required>
            <option [ngValue]="0" disabled>Pilih kategori</option>
            <option *ngFor="let item of categories" [ngValue]="getCategoryId(item)">
              {{ getCategoryName(item) }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Merek</label>
          <select
            class="form-select"
            name="brandId"
            [(ngModel)]="form.brandId"
            required>
            <option [ngValue]="0" disabled>Pilih merek</option>
            <option *ngFor="let item of brands" [ngValue]="getBrandId(item)">
              {{ getBrandName(item) }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Harga Sewa / Hari (Rp)</label>
          <input
            type="number"
            class="form-control"
            name="dailyPrice"
            [(ngModel)]="form.dailyPrice"
            min="0.01"
            step="0.01"
            required>
        </div>

        <div class="form-group">
          <label>Harga Penggantian (Rp)</label>
          <input
            type="number"
            class="form-control"
            name="replacementPrice"
            [(ngModel)]="form.replacementPrice"
            min="0.01"
            step="0.01"
            required>
        </div>

        <div class="form-group">
          <label>Total Stok</label>
          <input
            type="number"
            class="form-control"
            name="totalStock"
            [(ngModel)]="form.totalStock"
            min="0"
            step="1"
            required>
        </div>

        <div class="form-group">
          <label>Stok Rusak</label>
          <input
            type="number"
            class="form-control"
            name="damagedStock"
            [(ngModel)]="form.damagedStock"
            min="0"
            step="1"
            required>
        </div>

        <div class="form-group full-width">
          <label>Gambar Alat</label>
          <input
            #fileInput
            type="file"
            class="form-control"
            accept="image/jpeg,image/png,image/webp"
            (change)="onFileSelected($event)">
          <small class="text-muted">Format: jpg, png, webp. Maks 2MB.</small>
          @if (previewUrl) {
            <div class="mt-2">
              <img [src]="previewUrl" alt="Preview" style="max-height:160px;border-radius:8px;">
              <div>
                <button type="button" class="btn-cancel mt-2" (click)="removeImage(fileInput)">Hapus Gambar</button>
              </div>
            </div>
          }
        </div>

        <div class="form-group full-width">
          <label>Deskripsi</label>
          <textarea
            class="form-control"
            name="description"
            [(ngModel)]="form.description"
            rows="4"
            placeholder="Masukkan deskripsi alat (opsional)">
          </textarea>
        </div>

        <div class="form-group full-width">
          <label>Status Alat</label>
          <select
            class="form-select"
            name="isActive"
            [(ngModel)]="form.isActive">
            <option [ngValue]="true">Aktif</option>
            <option [ngValue]="false">Nonaktif</option>
          </select>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">
          Batal
        </button>

        <button type="submit" class="btn-save" [disabled]="isSaving">
          {{ isSaving ? 'Menyimpan...' : 'Simpan Alat' }}
        </button>
      </div>
    </form>
  </div>
</div>
