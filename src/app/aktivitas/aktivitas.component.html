<h2>Log Aktivitas</h2>
<p>Menampilkan riwayat aktivitas staff pada sistem HikeRent.</p>


<!-- Card Aktivitas -->
<div class="activity-card">

  <!-- Search -->
  <div class="search-container">
    <i class="bi bi-search"></i>

    <input type="text" class="form-control" placeholder="Cari nama staff"
      [(ngModel)]="searchText">
  </div>

  <!-- Data Table -->
  <app-data-table [title]="table.title" [headers]="table.headers" [data]="filteredActivities">
  </app-data-table>

</div>
