<h3>Data Customer</h3>
<p class="text-muted">Kelola data pelanggan penyewa</p>

<div class="d-flex justify-content-between align-items-center mb-3 gap-2">
  <input type="text" class="form-control" placeholder="Cari nama customer..." style="max-width: 320px;" [(ngModel)]="searchText" name="searchText">
  <button class="btn btn-success" type="button" routerLink="/customer/tambah">
    <i class="bi bi-plus-lg me-1"></i> Tambah Customer
  </button>
</div>
<app-data-table
  [title]="table.title"
  [headers]="table.headers"
  [data]="filteredData"
  (view)="viewCustomer($event)"
  (edit)="editCustomer($event)"
  class="my-custom-table">
</app-data-table>
