
<div class="dashboard-page">

  <!-- Header Dashboard -->
  <div class="dashboard-header">
    <h3>Dashboard</h3>
    <p class="text-muted">
      Ringkasan operasional penyewaan alat pendakian.
    </p>
  </div>
  
  <!-- Card Statistik -->
  <div class="row g-3">

    <!-- Total Alat -->
    <div class="col-12 col-md-6 col-xl-3">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body d-flex align-items-center gap-3">

          <div class="card-icon icon-total">
            <i class="bi bi-backpack3"></i>
          </div>

          <div>
            <h6 class="text-muted">Total Alat</h6>
            <h2 class="fw-bold mb-0">{{totalAlat}}</h2>
          </div>

        </div>
      </div>
    </div>

    <!-- Stock Tersedia -->
    <div class="col-12 col-md-6 col-xl-3">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body d-flex align-items-center gap-3">

          <div class="card-icon icon-stock">
            <i class="bi bi-box-seam"></i>
          </div>

          <div>
            <h6 class="text-muted">Stock Tersedia</h6>
            <h2 class="fw-bold mb-0">{{stockTersedia}}</h2>
          </div>

        </div>
      </div>
    </div>

    <!-- Rental Aktif -->
    <div class="col-12 col-md-6 col-xl-3">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body d-flex align-items-center gap-3">

          <div class="card-icon icon-rental">
            <i class="bi bi-arrow-repeat"></i>
          </div>

          <div>
            <h6 class="text-muted">Rental Aktif</h6>
            <h2 class="fw-bold mb-0">{{rentalAktif}}</h2>
          </div>

        </div>
      </div>
    </div>

    <!-- Menunggu Pengambilan -->
    <div class="col-12 col-md-6 col-xl-3">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body d-flex align-items-center gap-3">

          <div class="card-icon icon-pending">
            <i class="bi bi-clock-history"></i>
          </div>

          <div>
            <h6 class="text-muted">Menunggu Pembayaran</h6>
            <h2 class="fw-bold mb-0">{{menungguPembayaran}}</h2>
          </div>

        </div>
      </div>
    </div>

  </div>


  <!-- Bagian Tabel dan Ringkasan Stok -->
  <div class="row g-3 mt-2">

    <!-- Tabel Penyewaan -->
    <div class="col-12 col-xl-8">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <app-data-table
            [title]="table.title"
            [headers]="table.headers"
            [data]="table.data">
          </app-data-table>
        </div>
      </div>
    </div>

    <!-- Ringkasan Stock -->
    <div class="col-12 col-xl-4">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">

          <h5 class="fw-bold mb-3">Ringkasan Stock Alat</h5>

          <!-- Tersedia -->
          <div class="stock-item">
            <span class="stock-dot bg-success"></span>
            <span class="flex-grow-1">Tersedia</span>
            <span class="stock-number">{{stockTersedia}}</span>
          </div>

          <!-- Perawatan -->
          <div class="stock-item">
            <span class="stock-dot bg-warning"></span>
            <span class="flex-grow-1">Disewa</span>
            <span class="stock-number">{{disewa}}</span>
          </div>

          <!-- Rusak -->
          <div class="stock-item">
            <span class="stock-dot bg-danger"></span>
            <span class="flex-grow-1">Rusak</span>
            <span class="stock-number">{{rusak}}</span>
          </div>

        </div>
      </div>
    </div>

  </div>

</div>
