<h3>Dashboard</h3>
<p class="text-muted">Ringkasan Operasional penyewaan alat pendakian.</p>

<div class="row g-4">

  <div class="col-md-3">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h6>Total Alat</h6>
        <h2>
          <strong>
            1
          </strong>
        </h2>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h6>Stock Tersedia</h6>
        <h2>
          <strong>
            85
          </strong>
        </h2>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h6>Rental Aktif</h6>
        <h2>
          <strong>

            5
          </strong>
        </h2>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h6>Menunggu Pengambilan</h6>
        <h2>
          <strong>
            3
          </strong>
        </h2>
      </div>
    </div>
  </div>


</div>
<div class="row mt-3">
  <div class="col-md-8">
    <app-data-table [title]="table.title" [headers]="table.headers" [data]="table.data">
    </app-data-table>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h4>
          <strong>
            Ringkasan Stock Alat
          </strong>
        </h4>
        <div class="d-flex align-items-center border-bottom py-2">

          <span class="bg-success rounded-circle me-2" style="width: 8px; height: 8px; flex-shrink: 0;">
          </span>

          <span class="flex-grow-1">
            Tersedia
          </span>

          <span class="ms-3 fs-5 fw-bold">
            123
          </span>

        </div>

        <div class="d-flex align-items-center border-bottom py-2">

          <span class="bg-warning rounded-circle me-2" style="width: 8px; height: 8px; flex-shrink: 0;">
          </span>

          <span class="flex-grow-1">
            Perawatan
          </span>

          <span class="ms-3 fs-5 fw-bold">
            4
          </span>

        </div>
        <div class="d-flex align-items-center border-bottom py-2">

          <span class="bg-danger rounded-circle me-2" style="width: 8px; height: 8px; flex-shrink: 0;">
          </span>

          <span class="flex-grow-1">
            Rusak
          </span>

          <span class="ms-3 fs-5 fw-bold">
            2
          </span>

        </div>
      </div>
    </div>
  </div>
</div>
